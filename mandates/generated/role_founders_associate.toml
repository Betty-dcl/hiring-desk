# Role mandate for Founders' Associate, extracted from the posting.
#
# Source: https://jobs.ashbyhq.com/causaprima
# Extracted: 2026-09-18T12:37:06.757519+00:00 by claude-sonnet-5
#
# Every criterion below quotes the posting, and every quote was checked
# against it. Weights are NOT from the posting -- they are section
# defaults, and they are wrong until a human sets them. See intake/setup.py.
#
# This posting declares its own list a wishlist, not a checklist.
# Nothing here is a gate unless the posting separately said so.

[role]
id = "founders_associate"
title = "Founders' Associate"
company = "Causa Prima"
location = "Madrid, on-site"
summary = """
Here's what this role looks like in practice: setting up banking and financial operations across three countries, supporting fundraising efforts, modeling the strategic options for a new business line, running candidate trial days, building internal AI agents, organizing events with top-tier partners, and contributing to GTM. Not hypotheticals — all of this has actually happened in this seat.

The range is the job. One hour you're framing a business-model decision for the founders; the next you're chasing a teammate for a missing receipt so the month closes. If either end of that spectrum feels beneath you or beyond you, this isn't the role. The topics change every day, and you have to like that.

This is not a coordination role, and not a note-taking role. You work directly with the three co-founders, you're in the room for every critical decision, and you own the execution that follows.




WHAT YOU'LL DO

We'll iterate from here, but this is the real, current scope:

 - Frame strategy before it becomes a project. You're the first one on new strategic topics - a business model option, how to approach a new market, a build-vs-partner call. You structure the question, run the first pass of analysis, and give the founders a direction to react to before anyone commits resources.

 - Run financial operations. Three entities (US, Germany, Spain), external accountants in each, banking across four providers, payroll, invoicing, spend and receipt tracking, month-end coordination. Yo
"""

# from the posting: "3–4 years in a high-intensity environment. Top-tier consulting, banking, VC/PE, or an early-stage startup."
[[criteria]]
id = "high_intensity_experience"
question = "Tell me about the high-intensity environment you come from — consulting, banking, VC/PE, or an early-stage startup — and how long you were in it."
weight = 2  # section default -- confirm before use
looks_like = "3-4 years in a demanding role (top-tier consulting, banking, VC/PE, or early-stage startup) where the candidate was the person things got thrown at."

# from the posting: "Genuinely AI-native. This is a hard requirement, not a buzzword."
# declared a gate by: "This is a hard requirement, not a buzzword."
[[criteria]]
id = "ai_native"
question = "Show me a workflow you've automated or something you've built with a coding agent — how are you already using AI agents in your real work?"
weight = 2  # section default -- confirm before use
hard = true
looks_like = "Concrete examples of using AI agents to do real work, automating a workflow, or building something with a coding agent, with ability to demonstrate it live."

# from the posting: "You take a strategic framing session and a receipt-chasing task in the same afternoon with the same energy."
[[criteria]]
id = "full_spectrum_range"
question = "How do you handle going from a high-level strategic task to a mundane operational one, like chasing a receipt, in the same day?"
weight = 2  # section default -- confirm before use
looks_like = "Examples of moving between strategic framing work and unglamorous operational tasks without losing energy or dropping either."

# from the posting: "Extreme ownership. You see gaps, you fill them, and you don't wait to be told."
[[criteria]]
id = "extreme_ownership"
question = "Describe a time you noticed a gap with no clear owner and stepped in without being asked."
weight = 2  # section default -- confirm before use
looks_like = "A specific instance of identifying an unowned problem and taking it on proactively, not waiting for instructions."

# from the posting: "You can build a financial model, structure a market analysis, and write a compelling narrative with equal comfort."
